[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emnist-generative-modeling"
version = "0.1.0"
description = "Reusable utilities, documentation, and MLOps scaffolding for an EMNIST GAN/VAE coursework project."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Goh Kun Ming" }
]
keywords = ["emnist", "gan", "vae", "deep-learning", "mlops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy>=1.24"
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8",
  "nbformat>=5.10",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8"
]
ml = [
  "matplotlib>=3.8",
  "optuna>=3.6",
  "pandas>=2.0",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "seaborn>=0.13",
  "tensorflow>=2.15",
  "visualkeras>=0.1"
]
notebook = [
  "ipykernel>=6.29",
  "jupyterlab>=4.0",
  "nbformat>=5.10"
]

[project.scripts]
emnist-gan = "emnist_gan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "DELE_CA2_A (8).ipynb",
  "notebooks/parts"
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
branch = true
source = ["emnist_gan"]

[tool.coverage.report]
show_missing = true
skip_covered = true
